<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0d0f" />
<title>Dance Coach</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<style>
  :root{
    --bg:#0d0d0f; --panel:#17171b; --line:#2a2a31; --text:#f1efe9; --muted:#9a978f;
    --red:#d7263d; --gold:#d4a72c; --a:#d4a72c; --b:#4fa3ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;flex:1;letter-spacing:.3px}
  header h1 span{color:var(--gold)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:var(--panel);color:var(--muted);border:0;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--gold);color:#000;font-weight:600}
  main{max-width:1200px;margin:0 auto;padding:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 10px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
  .btn.gold{background:var(--gold);color:#000}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--text);font-weight:500}
  .btn:disabled{opacity:.4}
  .muted{color:var(--muted);font-size:13px}
  progress{width:100%;height:8px;accent-color:var(--gold)}
  input[type=file]{color:var(--muted);max-width:100%}
  .big1{font-size:54px;font-weight:700;width:90px;height:90px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:#000;border:2px solid var(--line)}
  .big1.one{border-color:var(--gold);color:var(--gold)}

  /* Écran 4 fenêtres */
  .grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  .grid.single{grid-template-columns:1fr}
  @media(max-width:700px){ .grid:not(.single){grid-template-columns:1fr 1fr;gap:6px} .pcap{font-size:12px} }
  .panel{background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
  .panel[hidden]{display:none}
  .vwrap{position:relative}
  .badge{position:absolute;top:10px;right:10px;min-width:64px;height:64px;padding:0 10px;border-radius:12px;background:rgba(0,0,0,.65);color:#fff;font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .badge.one{background:rgba(212,167,44,.95);color:#000}
  .badge:empty{display:none}
  .speed{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
  .speed input{flex:1;accent-color:var(--gold);height:28px}
  .speed b{min-width:52px;text-align:right;color:var(--gold);font-size:18px}
  .desc{flex:1;background:var(--panel);padding:16px 18px;aspect-ratio:var(--ar,16/9);overflow:auto;display:flex;flex-direction:column;gap:14px}
  .desc .fig{font-size:24px;font-weight:800;color:var(--gold);line-height:1.2}
  .desc .fig small{color:var(--muted);font-size:16px;font-weight:600;margin-left:8px}
  .desc .blk{font-size:19px;line-height:1.4}
  .desc .blk b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .ptitle{font-size:12px;font-weight:600;color:var(--gold);padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
  .panel video,.panel canvas{width:100%;display:block;background:#000;aspect-ratio:var(--ar,16/9);object-fit:contain}
  .pcap{padding:8px 10px;font-size:14px;background:var(--panel);min-height:52px;border-top:1px solid var(--line)}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tabs[hidden]{display:none}
  .tabs button{flex:1;min-width:70px;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 6px;font:inherit;font-size:13px;cursor:pointer}
  .tabs button.on{border-color:var(--gold);color:var(--text)}
  .counts{display:flex;gap:6px;align-items:center;margin-top:12px}
  .counts .n{flex:1;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:18px;font-weight:600;cursor:pointer}
  .counts .n.pause{color:var(--muted)}
  .counts .n.on{border:2px solid var(--gold);background:rgba(212,167,44,.15);color:var(--gold)}
  .counts .nav{width:40px;height:46px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--text);font-size:18px;cursor:pointer}
  .barinfo{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--muted);gap:8px;flex-wrap:wrap}
  .tips div{margin:6px 0}
  .tips b{color:var(--gold)}
  .warn{color:#ffb35c}
  #login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
  #login[hidden]{display:none}
  #login .box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
  #login input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font:inherit}
  label.opt{display:flex;gap:6px;align-items:center;font-size:14px}
  select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="box">
    <h2 style="margin:0">Dance Coach</h2>
    <div class="muted" data-t="pw"></div>
    <input id="pw" type="password" />
    <button class="btn gold" id="pwBtn">OK</button>
  </div>
</div>

<header>
  <h1>Dance <span>Coach</span></h1>
  <div class="seg" id="langSeg">
    <button data-lang="fr" class="on">FR</button><button data-lang="en">EN</button><button data-lang="es">ES</button>
  </div>
</header>

<main>
  <!-- Étape 1 : choisir la vidéo -->
  <section class="card" id="step1">
    <h2 data-t="s1"></h2>
    <div class="muted" data-t="s1tip" style="margin-bottom:10px"></div>
    <input type="file" id="file" accept="video/*" />
    <div id="cutBox" hidden style="margin-top:12px">
      <video id="cutVideo" playsinline controls style="width:min(100%,480px);border-radius:10px;background:#000"></video>
      <div class="muted" style="margin-top:8px" data-t="cutTip"></div>
      <label class="opt" style="margin-top:8px"><span data-t="cutStart"></span> <b id="cutStartTxt">0:00</b></label>
      <input type="range" id="cutStart" min="0" max="0" step="0.5" value="0" style="width:min(100%,480px);accent-color:var(--gold)" />
      <label class="opt"><span data-t="cutLen"></span> <b id="cutLenTxt">60 s</b></label>
      <input type="range" id="cutLen" min="5" max="60" step="1" value="60" style="width:min(100%,480px);accent-color:var(--gold)" />
      <div class="row" style="margin-top:8px">
        <button class="btn ghost" id="cutPrev" data-t="cutPrev"></button>
        <button class="btn ghost" id="cutPlay" data-t="cutPlay"></button>
        <button class="btn ghost" id="cutNext" data-t="cutNext"></button>
      </div>
      <div class="muted" id="cutRange" style="margin-top:6px"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <label class="opt"><span data-t="role"></span>
        <select id="role">
          <option value="leader" data-t="leader"></option>
          <option value="follower" data-t="follower"></option>
          <option value="both" data-t="both"></option>
        </select>
      </label>
      <label class="opt"><span data-t="dance"></span>
        <select id="danse">
          <option value="salsa on1">Salsa on1</option>
        </select>
      </label>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="prepBtn" disabled data-t="prepare"></button>
    </div>
    <div id="prepBox" hidden style="margin-top:12px">
      <div class="muted" id="prepMsg"></div>
      <progress id="prepBar" max="1" value="0"></progress>
    </div>
  </section>

  <!-- Étape 2 : caler le rythme -->
  <section class="card" id="step2" hidden>
    <h2 data-t="s2"></h2>
    <div class="muted" data-t="s2tip" style="margin-bottom:10px"></div>
    <div class="row" style="align-items:flex-start">
      <video id="calVideo" playsinline controls style="width:min(100%,420px);border-radius:10px;background:#000"></video>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="big1" id="calCount">–</div>
        <div class="muted"><span id="bpmTxt">–</span> BPM</div>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn gold" id="oneBtn" data-t="isone"></button>
      <button class="btn ghost" id="tapBtn" data-t="tap"></button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" data-bpm="-5">−5</button>
      <button class="btn ghost" data-bpm="-1">−1</button>
      <button class="btn ghost" data-bpm="1">+1</button>
      <button class="btn ghost" data-bpm="5">+5</button>
      <button class="btn ghost" data-bpm="half">÷2</button>
      <button class="btn ghost" data-bpm="double">×2</button>
    </div>
    <div class="muted" id="tapMsg" style="margin-top:8px"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="anaBtn" data-t="analyze"></button>
    </div>
    <div id="anaBox" hidden style="margin-top:12px">
      <div class="muted" id="anaMsg"></div>
      <progress id="anaBar" max="1" value="0"></progress>
    </div>
  </section>

  <!-- Étape 3 : les 4 fenêtres -->
  <section id="step3" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <div class="seg" id="viewSeg">
        <button data-view="4" class="on" data-t="view4"></button><button data-view="1" data-t="view1"></button>
      </div>
    </div>
    <div class="tabs" id="tabs" hidden>
      <button data-p="1" class="on" data-t="w1s"></button>
      <button data-p="2" data-t="w2s"></button>
      <button data-p="3" data-t="w3s"></button>
      <button data-p="4" data-t="w4s"></button>
    </div>
    <div class="grid" id="grid">
      <div class="panel" data-p="1">
        <div class="ptitle" data-t="w1"></div>
        <div class="vwrap">
          <video id="v" playsinline controls></video>
          <div class="badge" id="badge"></div>
        </div>
        <div class="speed">
          <span>🐢</span>
          <input type="range" id="speedRange" min="0.25" max="1" step="0.05" value="1" />
          <span>🐇</span>
          <b id="speedTxt">1×</b>
        </div>
        <div class="pcap muted" id="cap1"></div>
      </div>
      <div class="panel" data-p="2">
        <div class="ptitle" data-t="w2"></div>
        <div class="desc" id="desc"></div>
      </div>
      <div class="panel" data-p="3">
        <div class="ptitle" data-t="w3"></div>
        <canvas id="c3"></canvas>
        <div class="pcap" id="cap3"></div>
      </div>
      <div class="panel" data-p="4">
        <div class="ptitle" data-t="w4"></div>
        <canvas id="c4"></canvas>
        <div class="pcap" id="cap4"></div>
      </div>
    </div>

    <div class="counts" id="counts">
      <button class="nav" id="prevBar">‹</button>
      <button class="n" data-n="1">1</button><button class="n" data-n="2">2</button><button class="n" data-n="3">3</button>
      <button class="n" data-n="5">5</button><button class="n" data-n="6">6</button><button class="n" data-n="7">7</button>
      <button class="nav" id="nextBar">›</button>
    </div>
    <div class="barinfo"><span id="barTxt"></span><span id="figTxt"></span></div>

    <div class="card tips" style="margin-top:14px">
      <h2 data-t="tips"></h2>
      <div><b data-t="good"></b> <span id="tGood"></span></div>
      <div><b data-t="mistake"></b> <span id="tBad"></span></div>
      <div><b data-t="exercise"></b> <span id="tEx"></span></div>
      <div class="warn" id="tUnsure"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" id="restart" data-t="new"></button>
        <button class="btn ghost" id="recal" data-t="recal"></button>
        <button class="btn ghost" id="otherPart" data-t="otherPart"></button>
      </div>
    </div>
  </section>
</main>

<script>
// ==PURE== (fonctions sans écran, testables)
const POSE = {
  nose:0, lSh:11, rSh:12, lEl:13, rEl:14, lWr:15, rWr:16, lHip:23, rHip:24, lKn:25, rKn:26, lAn:27, rAn:28,
};
const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,31],[28,32]];
const UPPER = [0,11,12,13,14,15,16];

// Rythme : à partir du BPM et de l'instant d'un "1"
function beatLen(bpm){ return 60 / bpm; }
function countIndexAt(t, t1, bpm){ return Math.floor((t - t1) / beatLen(bpm) + 1e-6); }
function isPause(n){ return n === 4 || n === 8; }
function countNumber(k){ return ((k % 8) + 8) % 8 + 1; }
function barNumber(k){ return Math.floor(k / 8) + 1; }
function timeOfIndex(k, t1, bpm){ return t1 + k * beatLen(bpm); }
// Indices de comptes à analyser : de 0 s à la fin, 48 au maximum
function countsToAnalyze(end, t1, bpm, max = 48, start = 0){
  const b = beatLen(bpm);
  let k = Math.ceil((start - t1) / b - 1e-6);
  const out = [];
  while (out.length < max){
    const t = timeOfIndex(k, t1, bpm);
    if (t > end - 0.05) break;
    if (t >= start) out.push({ k, t, n: countNumber(k), m: barNumber(k) });
    k++;
  }
  return out;
}
// Passage de la vidéo : début et fin, 60 s au maximum
function clampSegment(start, length, total, max = 60){
  const len = Math.max(5, Math.min(length, max, total));
  const st = Math.max(0, Math.min(start, Math.max(0, total - len)));
  return { start: st, end: st + len };
}
function fmtTime(sec){
  const m = Math.floor(sec / 60), s2 = Math.floor(sec % 60);
  return `${m}:${String(s2).padStart(2, "0")}`;
}
// Ramener l'instant tapé sur la grille du tempo détecté
function snapToGrid(t, t0, bpm){
  const b = beatLen(bpm);
  return t0 + Math.round((t - t0) / b) * b;
}
// Tempo à partir de frappes (instants en secondes) : droite des moindres carrés, plus juste que premier/dernier
function tapTempo(taps){
  if (taps.length < 4) return null;
  const n = taps.length, mx = (n - 1) / 2, my = taps.reduce((a, b) => a + b, 0) / n;
  let num = 0, den = 0;
  taps.forEach((t, i) => { num += (i - mx) * (t - my); den += (i - mx) * (i - mx); });
  const per = num / den;
  return per > 0 ? Math.round(600 / per) / 10 : null;
}
// Courbe des attaques de la musique (percussions) : 2 bandes, compression log, variations positives
function onsetEnvelope(samples, sr){
  const hop = Math.round(sr / 100), win = hop * 2, env = [];
  let pLow = 0, pHigh = 0, lp = 0, prevX = 0;
  const a = Math.exp(-2 * Math.PI * 200 / sr); // passe-bas 200 Hz (basse, tumbao, grosse caisse)
  const low = new Float32Array(samples.length), high = new Float32Array(samples.length);
  for (let i = 0; i < samples.length; i++){
    const x = samples[i];
    lp = (1 - a) * x + a * lp; low[i] = lp;
    high[i] = x - prevX; prevX = x; // passe-haut simple (cloche, claves, timbales)
  }
  for (let i = 0; i + win < samples.length; i += hop){
    let el = 0, eh = 0;
    for (let j = i; j < i + win; j++){ el += low[j] * low[j]; eh += high[j] * high[j]; }
    const L = Math.log(1 + 1000 * el / win), H = Math.log(1 + 1000 * eh / win);
    env.push(Math.max(0, L - pLow) + Math.max(0, H - pHigh));
    pLow = L; pHigh = H;
  }
  // retirer la tendance locale
  const out = env.map((v, i) => {
    let m = 0, c = 0;
    for (let k = Math.max(0, i - 20); k <= Math.min(env.length - 1, i + 20); k++){ m += env[k]; c++; }
    return Math.max(0, v - m / c);
  });
  return { env: out, fr: sr / hop };
}
function envAt(env, pos){ const i = Math.floor(pos), f = pos - i; return (env[i] || 0) * (1 - f) + (env[i + 1] || 0) * f; }
// Peigne de temps : trouve le tempo précis (et le décalage) autour d'un tempo approximatif
function refineTempo(E, bpmGuess, range = 0.04){
  const { env, fr } = E;
  let best = -Infinity, bpm = bpmGuess, off = 0;
  for (let b = bpmGuess * (1 - range); b <= bpmGuess * (1 + range); b += 0.05){
    const per = 60 * fr / b;
    for (let o = 0; o < per; o += 0.5){
      let s = 0, c = 0;
      for (let i = o; i < env.length - 1; i += per){ s += envAt(env, i); c++; }
      s /= c || 1;
      if (s > best){ best = s; bpm = b; off = o; }
    }
  }
  return { bpm: Math.round(bpm * 100) / 100, t0: off / fr };
}
// Estimation du tempo de la musique, avec une préférence pour les tempos de salsa (≈ 150-220 BPM)
function estimateTempo(samples, sr, prior = 190){
  const E = onsetEnvelope(samples, sr);
  const { env, fr } = E;
  const mean = env.reduce((a, b) => a + b, 0) / (env.length || 1);
  const x = env.map(v => v - mean);
  const ac = lag => { let s = 0; for (let i = 0; i + lag < x.length; i++) s += x[i] * x[i + lag]; return s / (x.length - lag); };
  const minLag = Math.floor(fr * 60 / 240), maxLag = Math.ceil(fr * 60 / 70);
  const A = []; for (let l = 0; l <= 2 * maxLag + 2; l++) A[l] = l >= minLag ? ac(l) : 0;
  let bestLag = 0, best = -Infinity;
  for (let lag = minLag; lag <= maxLag; lag++){
    const bpm = 60 * fr / lag;
    const w = Math.exp(-0.5 * Math.pow(Math.log2(bpm / prior) / 0.25, 2));
    const s = A[lag] * w;
    if (s > best){ best = s; bestLag = lag; }
  }
  if (!bestLag) return null;
  const r = refineTempo(E, 60 * fr / bestLag, 0.04);
  return { bpm: r.bpm, t0: r.t0, E };
}
// Trier les danseurs de gauche à droite (A = gauche, B = droite)
function sortPoses(poses){
  const cx = p => ((p[23]?.[0] ?? p[0][0]) + (p[24]?.[0] ?? p[0][0])) / 2;
  return poses.slice().sort((a, b) => cx(a) - cx(b));
}
// Image de poses la plus proche d'un instant
function nearestFrame(frames, t){
  if (!frames.length) return null;
  let lo = 0, hi = frames.length - 1;
  while (lo < hi){ const mid = (lo + hi) >> 1; if (frames[mid].t < t) lo = mid + 1; else hi = mid; }
  if (lo > 0 && Math.abs(frames[lo-1].t - t) < Math.abs(frames[lo].t - t)) lo--;
  return frames[lo];
}
// Cadre englobant de points visibles, avec marge, au format voulu
function boxOf(points, margin, aspect){
  const vis = points.filter(p => p && (p[2] ?? 1) > 0.3);
  if (!vis.length) return null;
  let x0 = Math.min(...vis.map(p => p[0])), x1 = Math.max(...vis.map(p => p[0]));
  let y0 = Math.min(...vis.map(p => p[1])), y1 = Math.max(...vis.map(p => p[1]));
  let w = x1 - x0, h = y1 - y0;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  w = Math.max(w * (1 + margin), 0.15); h = Math.max(h * (1 + margin), 0.15);
  if (w / h > aspect) h = w / aspect; else w = h * aspect;
  return { x: cx - w / 2, y: cy - h / 2, w, h };
}
function pick(obj, lang){ return obj ? (obj[lang] || obj.fr || "") : ""; }
// ==/PURE==
</script>

<script type="module">
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
const MAX_SECONDS = 60, FPS = 8;

const T = {

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },

};

function t(k){ return (T[lang] && T[lang][k]) || T.fr[k] || k; }

  document.documentElement.lang = lang;

// ---------- Étape 1 ----------
const cutV = $("#cutVideo");
$("#file").onchange = () => {
  S.file = $("#file").files[0] || null;
  $("#prepBtn").disabled = !S.file;
  if (!S.file) return;
  if (S.url) URL.revokeObjectURL(S.url);
  S.url = URL.createObjectURL(S.file);
  cutV.src = S.url;
  cutV.onloadedmetadata = () => {
    S.total = cutV.duration || 0;
    $("#cutBox").hidden = false;
    $("#cutStart").max = Math.max(0, S.total - 5);
    $("#cutStart").value = 0;
    $("#cutLen").max = Math.max(5, Math.min(60, Math.floor(S.total)));
    $("#cutLen").value = Math.min(60, Math.floor(S.total));
    updateCut();
  };
};
function updateCut(){
  const seg = clampSegment(Number($("#cutStart").value), Number($("#cutLen").value), S.total);
  S.start = seg.start; S.end = seg.end;
  $("#cutStart").value = S.start;
  $("#cutStartTxt").textContent = fmtTime(S.start);
  $("#cutLenTxt").textContent = `${Math.round(S.end - S.start)} s`;
  $("#cutRange").textContent = `${t("cutSel")} ${fmtTime(S.start)} → ${fmtTime(S.end)} / ${fmtTime(S.total)}`;
  $("#cutPrev").disabled = S.start <= 0;
  $("#cutNext").disabled = S.end >= S.total - 0.5;
}
$("#cutStart").oninput = () => { updateCut(); cutV.currentTime = S.start; };
$("#cutLen").oninput = updateCut;
$("#cutPrev").onclick = () => { $("#cutStart").value = Math.max(0, S.start - 60); updateCut(); cutV.currentTime = S.start; };
$("#cutNext").onclick = () => { $("#cutStart").value = S.start + 60; updateCut(); cutV.currentTime = S.start; };
$("#cutPlay").onclick = () => { cutV.currentTime = S.start; cutV.play(); };
// Les vidéos restent dans le passage choisi
function keepInSegment(video){
  video.addEventListener("timeupdate", () => {
    if (!S.end) return;
    if (video.currentTime > S.end || video.currentTime < S.start - 0.3){
      video.currentTime = S.start;
      if (video === cutV) video.pause();
    }
  });
}
keepInSegment(cutV);

function seek(video, time){
  return new Promise(ok => {
    let timer;
    const done = () => { clearTimeout(timer); video.removeEventListener("seeked", done); ok(); };
    video.addEventListener("seeked", done);
    timer = setTimeout(done, 4000); // ne jamais rester bloqué sur un téléphone lent
    video.currentTime = time;
  });
}
// Libère le lecteur d'une vidéo (les téléphones n'en acceptent que quelques-uns à la fois)
function freePlayer(el){
  if (!el || !el.getAttribute("src")) return;
  el.pause(); el.removeAttribute("src"); el.load();
}
function loadOnce(video, url){
  return new Promise((ok, ko) => {
    video.muted = true; video.playsInline = true; video.preload = "auto";
    video.setAttribute("playsinline", "");
    if (!video.isConnected){ video.style.cssText = "position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"; document.body.appendChild(video); }
    const timer = setTimeout(() => ko(new Error("Vidéo trop longue à charger")), 30000);
    video.onloadeddata = () => { clearTimeout(timer); video.onerror = null; ok(video); };
    video.onerror = () => { clearTimeout(timer); ko(new Error("Vidéo illisible" + (video.error ? ` (code ${video.error.code})` : ""))); };
    video.src = url;
  });
}
// Une seule vidéo de travail, réutilisée ; si le téléphone refuse, on libère les autres lecteurs et on réessaie
let WORK = null;
async function getWork(url, others = []){
  if (WORK && WORK.dataset.url === url && WORK.readyState >= 2) return WORK;
  if (WORK){ freePlayer(WORK); WORK.remove(); WORK = null; }
  for (let attempt = 0; attempt < 2; attempt++){
    const el = document.createElement("video");
    try{
      await loadOnce(el, url);
      el.dataset.url = url; WORK = el; return el;
    }catch(e){
      freePlayer(el); el.remove();
      if (attempt === 1) throw e;
      others.forEach(freePlayer);
      await new Promise(r => setTimeout(r, 500));
    }
  }
}

async function createLandmarker(){
  const { PoseLandmarker, FilesetResolver } = await import(`${MP}/vision_bundle.mjs`);
  const vision = await FilesetResolver.forVisionTasks(`${MP}/wasm`);
  const opts = d => ({ baseOptions:{ modelAssetPath: MODEL, delegate: d }, runningMode:"VIDEO", numPoses:2, minPoseDetectionConfidence:0.4 });
  try{ return await PoseLandmarker.createFromOptions(vision, opts("GPU")); }
  catch{ return await PoseLandmarker.createFromOptions(vision, opts("CPU")); }
}

async function prepare(){
  const msg = $("#prepMsg"), bar = $("#prepBar");
  $("#prepBox").hidden = false; $("#prepBtn").disabled = true;
  try{
    cutV.pause();
    const work = await getWork(S.url, [cutV]);
    S.total = work.duration || S.total;
    if (!S.end){ const seg = clampSegment(0, MAX_SECONDS, S.total); S.start = seg.start; S.end = seg.end; }
    S.duration = S.end - S.start;
    S.aspect = (work.videoWidth && work.videoHeight) ? work.videoWidth / work.videoHeight : 16/9;

    // 1) Rythme
    msg.textContent = t("audio"); bar.value = 0.02;
    let tempo = null;
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      const buf = await ctx.decodeAudioData(await S.file.arrayBuffer());
      const a = Math.floor(buf.sampleRate * S.start), b = Math.min(buf.length, Math.floor(buf.sampleRate * S.end));
      tempo = estimateTempo(buf.getChannelData(0).subarray(a, b), buf.sampleRate);
      if (tempo) tempo.t0 += S.start;
      ctx.close && ctx.close();
    }catch{ tempo = null; }
    if (tempo){ S.bpm = tempo.bpm; S.t0 = tempo.t0; S.E = tempo.E; S.Estart = S.start; } else { S.bpm = 180; S.t0 = S.start; S.E = null; }
    S.t1 = S.t0;

    // 2) Corps image par image
    msg.textContent = t("loadingModel"); bar.value = 0.05;
    const lm = await createLandmarker();
    msg.textContent = t("poses");
    S.frames = [];
    const total = Math.floor(S.duration * FPS);
    for (let i = 0; i <= total; i++){
      const time = S.start + i / FPS;
      await seek(work, Math.min(time, S.end - 0.01));
      const r = lm.detectForVideo(work, Math.round(time * 1000) + 1);
      const poses = (r.landmarks || []).map(p => p.map(q => [+q.x.toFixed(4), +q.y.toFixed(4), +(q.visibility ?? 1).toFixed(2)]));
      S.frames.push({ t: time, poses: sortPoses(poses) });
      bar.value = 0.05 + 0.95 * (i / Math.max(total, 1));
    }
    lm.close && lm.close();
    computeAnkleRange();
    if (!tempo) msg.textContent = t("noAudio");
    openStep2();
  }catch(e){
    msg.textContent = t("err") + e.message;
  }
  $("#prepBtn").disabled = false;
}
$("#prepBtn").onclick = prepare;

function computeAnkleRange(){
  let x0 = 1, x1 = 0, y0 = 1, y1 = 0;
  for (const f of S.frames) for (const p of f.poses) for (const i of [27, 28]){
    const q = p[i]; if (!q || q[2] < 0.3) continue;
    x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]);
  }
  if (x1 <= x0){ x0 = 0; x1 = 1; } if (y1 <= y0){ y0 = 0; y1 = 1; }
  const px = (x1 - x0) * 0.15 + 0.02, py = (y1 - y0) * 0.25 + 0.02;
  S.ankleRange = { x0: x0 - px, x1: x1 + px, y0: y0 - py, y1: y1 + py };
}

// ---------- Étape 2 : rythme ----------
const cal = $("#calVideo");
keepInSegment(cal);
function openStep2(){
  $("#step2").hidden = false;
  cal.src = S.url; cal.muted = false;
  cal.onloadedmetadata = () => { cal.currentTime = S.start; };
  $("#bpmTxt").textContent = S.bpm;
  $("#tapMsg").textContent = "";
  S.taps = [];
  $("#step2").scrollIntoView({ behavior:"smooth" });
  calLoop();
}
let calRaf = 0;
function calLoop(){
  cancelAnimationFrame(calRaf);
  const tick = () => {
    const k = countIndexAt(cal.currentTime, S.t1, S.bpm);
    const n = countNumber(k);
    const el = $("#calCount");
    el.textContent = isPause(n) ? "" : n; el.classList.toggle("one", n === 1);
    calRaf = requestAnimationFrame(tick);
  };
  tick();
}
const LAT = 0.15; // temps de réaction + retard du son sur téléphone
// Grille des temps de la musique (si elle a été analysée)
function gridPhase(){ return S.E ? S.Estart + refineTempo(S.E, S.bpm, 0.004).t0 : S.t0; }
$("#oneBtn").onclick = () => {
  S.t1 = snapToGrid(cal.currentTime - LAT, gridPhase(), S.bpm);
  S.t0 = S.t1;
  $("#tapMsg").textContent = t("oneOk");
};
$("#tapBtn").onclick = () => {
  const now = cal.currentTime;
  if (S.taps.length && (now < S.taps[S.taps.length - 1] || now - S.taps[S.taps.length - 1] > 2)) S.taps = [];
  S.taps.push(now);
  let bpm = tapTempo(S.taps);
  if (!bpm){ $("#tapMsg").textContent = t("tapNeed"); return; }
  // En salsa on compte chaque temps (≈ 150-220 BPM) : des frappes 2 fois trop lentes sont doublées
  while (bpm < 125) bpm *= 2;
  // Les frappes donnent le tempo approximatif ; la musique donne le tempo exact
  let phase = S.taps[0] - LAT;
  if (S.E){ const r = refineTempo(S.E, bpm, 0.06); bpm = r.bpm; phase = snapToGrid(S.taps[0] - LAT, S.Estart + r.t0, bpm); }
  S.bpm = bpm; S.t1 = phase; S.t0 = S.t1;
  $("#bpmTxt").textContent = S.bpm;
  $("#tapMsg").textContent = t("tapOk");
};
document.querySelectorAll("[data-bpm]").forEach(b => b.onclick = () => {
  const v = b.dataset.bpm;
  S.bpm = v === "half" ? S.bpm / 2 : v === "double" ? S.bpm * 2 : S.bpm + Number(v);
  S.bpm = Math.min(Math.max(S.bpm, 60), 260);
  if (S.E && (v === "half" || v === "double")){
    const r = refineTempo(S.E, S.bpm, 0.02);
    S.bpm = r.bpm; S.t1 = snapToGrid(S.t1, S.Estart + r.t0, S.bpm); S.t0 = S.t1;
  }
  S.bpm = Math.round(S.bpm * 100) / 100;
  $("#bpmTxt").textContent = S.bpm;
});

// ---------- Analyse ----------
function pointsAt(time){
  const f = nearestFrame(S.frames, time);
  if (!f) return {};
  const out = {};
  f.poses.slice(0, 2).forEach((p, i) => {
    const pt = j => p[j] && p[j][2] > 0.3 ? [p[j][0], p[j][1]] : null;
    out[i ? "B" : "A"] = { chevilleG: pt(27), chevilleD: pt(28), poignetG: pt(15), poignetD: pt(16), hancheG: pt(23), hancheD: pt(24) };
  });
  return out;
}
async function analyze(){
  cal.pause();
  const msg = $("#anaMsg"), bar = $("#anaBar");
  $("#anaBox").hidden = false; $("#anaBtn").disabled = true;
  try{
    S.list = countsToAnalyze(S.end, S.t1, S.bpm, 200, S.start).filter(c => !isPause(c.n)); // on ne compte pas 4 et 8
    msg.textContent = t("frames");
    const work = await getWork(S.url, [cutV, cal]);
    const W = 320, H = Math.round(W / S.aspect);
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const cx = cv.getContext("2d");
    const comptes = [];
    for (let i = 0; i < S.list.length; i++){
      const c = S.list[i];
      await seek(work, Math.min(c.t, S.end - 0.01));
      cx.drawImage(work, 0, 0, W, H);
      comptes.push({ i, n: c.n, m: c.m, t: +c.t.toFixed(2), points: pointsAt(c.t), image: cv.toDataURL("image/jpeg", 0.6) });
      bar.value = 0.3 * (i + 1) / S.list.length;
    }
    // Envoi par petits paquets de 16 comptes (2 mesures), 3 à la fois : plus rapide et plus fiable
    const CHUNK = 16, PAR = 3, parts = [];
    for (let i = 0; i < comptes.length; i += CHUNK) parts.push(comptes.slice(i, i + CHUNK));
    const results = new Array(parts.length);
    const t0 = Date.now();
    let done = 0;
    const show = (extra = "") => {
      const sec = Math.round((Date.now() - t0) / 1000);
      msg.textContent = `${t("ai")} ${done}/${parts.length} · ${sec} s${extra}`;
    };
    const tick = setInterval(() => show(), 1000);
    async function sendPart(pi){
      const offset = pi * CHUNK;
      const req = JSON.stringify({ password, role: $("#role").value, danse: $("#danse").value,
        comptes: parts[pi].map(c => ({ ...c, i: c.i - offset })) });
      let r, data;
      for (let a = 0; a < 3; a++){
        if (a) { show(` · ↻ ${a + 1}/3`); await new Promise(ok => setTimeout(ok, 6000 * a)); }
        const ctl = new AbortController();
        const kill = setTimeout(() => ctl.abort(), 150000); // jamais plus de 2 min 30 par paquet
        r = await fetch("/api/analyze", { method:"POST", headers:{ "content-type":"application/json" }, body: req, signal: ctl.signal }).catch(() => null);
        clearTimeout(kill);
        data = r ? await r.json().catch(() => ({ error:`Erreur ${r.status}` })) : { error:"Pas de réponse (connexion ou délai dépassé)" };
        if (r && (r.ok || ![500, 502, 503, 504].includes(r.status))) break;
      }
      if (r && r.status === 401){ store.set("dd_pw", ""); password = ""; $("#login").hidden = false; }
      if (!r || !r.ok) throw new Error(data.error || `Erreur ${r ? r.status : ""}`);
      results[pi] = { data, offset };
      done++; bar.value = 0.3 + 0.7 * done / parts.length; show();
    }
    show();
    try{
      let next = 0;
      const worker = async () => { while (next < parts.length){ const pi = next++; await sendPart(pi); } };
      await Promise.all(Array.from({ length: Math.min(PAR, parts.length) }, worker));
    } finally { clearInterval(tick); }
    const merged = { figure_principale:null, comptes:[], conseils:null, incertain:null };
    for (const { data, offset } of results){
      merged.figure_principale = merged.figure_principale || data.figure_principale;
      merged.conseils = merged.conseils || data.conseils;
      if (data.incertain && Object.values(data.incertain).some(Boolean)) merged.incertain = merged.incertain || data.incertain;
      (data.comptes || []).forEach((c, j) => merged.comptes.push({ ...c, i: (Number.isInteger(c.i) ? c.i : j) + offset }));
    }
    S.analysis = merged;
    bar.value = 1;
    openStep3();
  }catch(e){
    msg.textContent = t("err") + e.message;
    if (!cal.getAttribute("src")){ cal.addEventListener("loadeddata", () => { cal.currentTime = S.start; }, { once:true }); cal.src = S.url; }
  }
  $("#anaBtn").disabled = false;
}
$("#anaBtn").onclick = analyze;

// ---------- Étape 3 : les 4 fenêtres ----------
const v = $("#v"), c3 = $("#c3"), c4 = $("#c4");
keepInSegment(v);
function openStep3(){
  $("#step1").hidden = true; $("#step2").hidden = true; $("#step3").hidden = false;
  document.documentElement.style.setProperty("--ar", `${S.aspect}`);
  freePlayer(cal); freePlayer(cutV); freePlayer(WORK);
  v.src = S.url; v.muted = false;
  v.onloadedmetadata = () => { v.currentTime = S.start; };
  const base = 640;
  c3.width = base; c3.height = Math.round(base / S.aspect);
  c4.width = base; c4.height = Math.round(base / S.aspect);
  setView(S.view);
  updateTips();
  window.scrollTo(0, 0);
  drawLoop();

function entryForIndex(k){
  const pos = S.list.findIndex(c => c.k === k);
  if (pos < 0 || !S.analysis?.comptes) return null;
  return S.analysis.comptes.find(c => c.i === pos) || S.analysis.comptes[pos] || null;
}

  const a = S.analysis || {};

// Barre des comptes

document.querySelectorAll("#counts .n").forEach(b => b.onclick = () => {
  const k = currentK(); const start = k - (countNumber(k) - 1);

});

$("#nextBar").onclick = () => { const k = currentK(); v.currentTime = Math.min(S.end - 0.05, timeOfIndex(k - (countNumber(k) - 1) + 8, S.t1, S.bpm) + 0.01); };
$("#restart").onclick = () => location.reload();

  v.pause(); S.analysis = null;
  $("#step3").hidden = true; $("#step2").hidden = true; $("#step1").hidden = false; $("#prepBox").hidden = true; $("#anaBox").hidden = true;
  if (S.end < S.total - 0.5){ $("#cutStart").value = S.start + 60; updateCut(); }
  if (!cutV.getAttribute("src")){ cutV.onloadedmetadata = null; cutV.addEventListener("loadeddata", () => { cutV.currentTime = S.start; }, { once:true }); cutV.src = S.url; }
  else cutV.currentTime = S.start;
  window.scrollTo(0, 0);

$("#recal").onclick = () => { v.pause(); $("#step3").hidden = true; $("#step1").hidden = false; openStep2(); };

// Dessin
const COLORS = ["#d4a72c", "#4fa3ff"];
function drawSkeleton(ctx, pose, color, box, W, H){
  const X = p => (p[0] - box.x) / box.w * W, Y = p => (p[1] - box.y) / box.h * H;
  ctx.strokeStyle = color; ctx.lineWidth = Math.max(2, W / 200); ctx.lineCap = "round";
  for (const [a, b] of BONES){
    const p = pose[a], q = pose[b];
    if (!p || !q || p[2] < 0.3 || q[2] < 0.3) continue;
    ctx.beginPath(); ctx.moveTo(X(p), Y(p)); ctx.lineTo(X(q), Y(q)); ctx.stroke();
  }
  ctx.fillStyle = color;
  for (const i of [15, 16, 27, 28]){
    const p = pose[i]; if (!p || p[2] < 0.3) continue;
    ctx.beginPath(); ctx.arc(X(p), Y(p), Math.max(4, W / 110), 0, 7); ctx.fill();
  }
}
function label(ctx, text, x, y, size, color, bg){
  ctx.font = `600 ${size}px -apple-system, Segoe UI, Roboto, sans-serif`;
  const w = ctx.measureText(text).width;
  if (bg){ ctx.fillStyle = bg; ctx.fillRect(x - 6, y - size, w + 12, size * 1.35); }
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}
function drawFoot(ctx, x, y, isLeft, color, n, r){
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.55, r, 0, 0, 7);
  ctx.lineWidth = 2; ctx.strokeStyle = color;
  if (isLeft){ ctx.stroke(); } else { ctx.fillStyle = color; ctx.globalAlpha = 0.55; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke(); }
  ctx.fillStyle = "#fff"; ctx.font = `600 ${Math.round(r * 0.9)}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(String(n), 0, 1);
  ctx.restore();
}

const FEET = [25, 26, 27, 28, 29, 30, 31, 32];
// Cadre de zoom lissé (pas de tremblement) et toujours dans l'image
const BOXES = {};
function smoothBox(key, target, fallback){
  const tgt = target || BOXES[key] || fallback;
  const w = Math.min(1, tgt.w), h = Math.min(1, tgt.h);
  const t2 = { w, h, x: Math.min(Math.max(tgt.x, 0), 1 - w), y: Math.min(Math.max(tgt.y, 0), 1 - h) };
  const cur = BOXES[key];
  BOXES[key] = cur ? { x: cur.x + (t2.x - cur.x) * 0.12, y: cur.y + (t2.y - cur.y) * 0.12, w: cur.w + (t2.w - cur.w) * 0.12, h: cur.h + (t2.h - cur.h) * 0.12 } : t2;
  return BOXES[key];
}
function zoomDraw(ctx, box, W, H){
  const vw = v.videoWidth, vh = v.videoHeight;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(v, box.x * vw, box.y * vh, box.w * vw, box.h * vh, 0, 0, W, H);
}
let lastK = null, raf = 0;
function drawLoop(){
  cancelAnimationFrame(raf);
  const tick = () => { try{ draw(); }catch(e){ /* image pas prête */ } raf = requestAnimationFrame(tick); };
  tick();
}
function draw(){
  if (!v.videoWidth) return;
  const time = v.currentTime;
  const k = countIndexAt(time, S.t1, S.bpm);
  const n = countNumber(k), m = barNumber(k) - (S.list.length ? barNumber(S.list[0].k) : 1) + 1;
  const f = nearestFrame(S.frames, time);
  const poses = f ? f.poses : [];
  const e = entryForIndex(isPause(n) ? k - 1 : k);
  const full = { x:0, y:0, w:1, h:1 };

  // Fenêtre 1 : le compte par-dessus la vidéo
  {
    const bd = $("#badge");
    const txt = isPause(n) ? "" : String(n);
    if (bd.textContent !== txt){ bd.textContent = txt; bd.classList.toggle("one", n === 1); }
  }

  // Fenêtre 3 : haut du corps (zoom sur la vraie vidéo, sans dessin)
  {
    const ctx = c3.getContext("2d"), W = c3.width, H = c3.height;
    const pts = poses.slice(0, 2).flatMap(p => UPPER.map(i => p[i]));
    const box = smoothBox("b3", boxOf(pts, 0.6, 1), { x:0, y:0, w:1, h:0.6 });
    zoomDraw(ctx, box, W, H);
    if (!isPause(n)) label(ctx, String(n), 14, 44, 34, "#fff", "rgba(0,0,0,.6)");
  }

  // Fenêtre 4 : les pieds (zoom sur la vraie vidéo, sans dessin)
  {
    const ctx = c4.getContext("2d"), W = c4.width, H = c4.height;
    const pts = poses.slice(0, 2).flatMap(p => FEET.map(i => p[i]));
    const box = smoothBox("b4", boxOf(pts, 0.8, 1), { x:0, y:0.5, w:0.5, h:0.5 });
    zoomDraw(ctx, box, W, H);
    if (!isPause(n)) label(ctx, String(n), 14, 44, 34, "#fff", "rgba(0,0,0,.6)");
  }

  // Textes (seulement quand le compte change)
  if (k !== lastK){
    lastK = k;
    document.querySelectorAll("#counts .n").forEach(b => b.classList.toggle("on", Number(b.dataset.n) === n));
    $("#barTxt").textContent = `${t("bar")} ${m}${isPause(n) ? "" : " · " + n} · ${S.bpm} BPM`;
    $("#figTxt").textContent = pick(e?.figure, lang) || pick(S.analysis?.figure_principale, lang);
    const none = `<span class="muted">${t("notAnalyzed")}</span>`;
    const esc = s => String(s || "").replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
    $("#cap1").textContent = `${t("bar")} ${m}${isPause(n) ? "" : " · " + n}`;
    const fig = pick(e?.figure, lang) || pick(S.analysis?.figure_principale, lang);
    const sh = isPause(n) ? n - 1 : n;
    $("#desc").innerHTML = (fig ? `<div class="fig">${esc(fig)}<small>${esc(t("bar"))} ${m} · ${sh}</small></div>` : "")
      + (e ? [["feet", e.pieds, "🦶"], ["hands", e.mains, "🙌"], ["body", e.corps, "🔄"]]
          .map(([key, val, ico]) => `<div class="blk"><b>${ico} ${esc(t(key))}</b>${esc(pick(val, lang))}</div>`).join("") : none);
    $("#cap3").innerHTML = e ? `<b>${esc(t("hands"))} :</b> ${esc(pick(e.mains, lang))}` : none;
    $("#cap4").innerHTML = e ? `<b>${esc(t("feet"))} :</b> ${esc(pick(e.pieds, lang))}` : none;
  }
}
